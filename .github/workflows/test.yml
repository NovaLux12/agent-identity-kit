name: Conformance Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    name: agent-identity-kit v1.1 conformance
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: tests
        run: npm ci

      - name: Run conformance suite
        working-directory: tests
        run: npm test

      - name: Validate positive-case examples via the bash validator (Linux)
        run: |
          set -e
          for f in examples/*.json; do
            # The revoked-card fixture is a negative test (see next step).
            # It is schema-valid but is correctly refused by --strict per SPEC §4.5.
            if [[ "$(basename "$f")" == *revoked* ]]; then continue; fi
            echo "Validating $f..."
            bash skill/scripts/validate.sh "$f" --strict || {
              echo "::error::$f failed validation"
              exit 1
            }
          done

      - name: Validate revoked-card semantics (negative test)
        run: |
          # The revoked-zombie fixture is a negative test: schema-valid
          # but semantically refused. Strict mode MUST refuse it.
          # This step is the inverse of the positive-case check above —
          # it asserts the refuse behaviour explicitly.
          set -e
          if bash skill/scripts/validate.sh examples/revoked-zombie.agent.json --strict; then
            echo "::error::revoked-zombie should have been refused by --strict"
            exit 1
          fi
          echo "OK: revoked-zombie correctly refused (SPEC §4.5)"

      - name: Shellcheck the bash scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./skill/scripts
          additional_files: ""